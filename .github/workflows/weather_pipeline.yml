name: Weather Data Pipeline

on:

  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: weather-data-pipeline
  cancel-in-progress: false


jobs:

  weather-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Show repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f


      - name: Run weather pipeline
        run: |
          python src/main.py


      - name: Save updated database
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weather.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update weather database"
            git push
          fi